name: Deploy to Production

on:
  push:
    branches:
      - prod

env:
  PROJECT_ID: log-sentinel-ai-491001
  REGION: us-central1
  SERVICE_NAME: logsentinel-api
  REGISTRY: us-central1-docker.pkg.dev/log-sentinel-ai-491001/logsentinel

jobs:
  deploy-backend:
    name: Build and deploy backend to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/584409740995/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@log-sentinel-ai-491001.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build -t ${{ env.REGISTRY }}/api:${{ github.sha }} .
          docker tag ${{ env.REGISTRY }}/api:${{ github.sha }} ${{ env.REGISTRY }}/api:latest

      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/api:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/api:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.REGISTRY }}/api:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --add-cloudsql-instances=log-sentinel-ai-491001:us-west1:log-sentinel-db \
            --set-env-vars="DB_HOST=/cloudsql/log-sentinel-ai-491001:us-west1:log-sentinel-db,DB_PORT=${{ secrets.DB_PORT }},DB_NAME=${{ secrets.DB_NAME }},DB_USER=${{ secrets.DB_USER }},DB_PASSWORD=${{ secrets.DB_PASSWORD }},SECRET_KEY=${{ secrets.SECRET_KEY }},OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }},FRONTEND_URL=${{ secrets.FRONTEND_URL }}"

  deploy-frontend:
    name: Build and deploy frontend to Firebase
    runs-on: ubuntu-latest
    needs: deploy-backend
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/584409740995/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@log-sentinel-ai-491001.iam.gserviceaccount.com
          token_format: access_token

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: Frontend

      - name: Build frontend
        run: npm run build
        working-directory: Frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project log-sentinel-ai-491001
        working-directory: Frontend
